name = "stride-api"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

[[kv_namespaces]]
binding = "STRIDE_KV"
id = "5b174c8066bd430c938591b6bf975ead"

# Note: Cloudflare Free account already uses its 5-cron quota across other Workers;
# /v1/admin/cron/heatmap and scheduled GitHub workflows trigger heatmap rebuilds cleanly.

[vars]
APP_ORIGIN = "http://localhost:3000"
API_ORIGIN = "https://stride-api.srimantasutapa123.workers.dev"
CORS_ORIGINS = "http://localhost:3000,http://127.0.0.1:3000"
BREVO_SENDER_NAME = "Stride"
BREVO_SENDER_EMAIL = "srimantasutapa123@gmail.com"
