name: Stride CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web-and-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run build --workspace=packages/track-engine
      - run: npm run test --workspace=packages/track-engine
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build --workspace=web

  flutter-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.1"
          channel: stable
          cache: true
      - working-directory: app
        run: |
          flutter pub get
          flutter gen-l10n
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
          flutter build apk --release --dart-define=STRIDE_API_URL=https://stride-api.srimantasutapa123.workers.dev

  stride-lite-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - working-directory: app-lite
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleRelease
