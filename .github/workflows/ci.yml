name: Stride CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web-and-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run build --workspace=packages/track-engine
      - run: npm run test --workspace=packages/track-engine
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build --workspace=web

  flutter-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.0"
          channel: stable
          cache: true
      - working-directory: app
        run: |
          flutter pub get
          flutter gen-l10n
          flutter analyze
          flutter test
          flutter build apk --release
